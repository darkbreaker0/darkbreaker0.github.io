# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "Tien-Chen Lin"
title: "Postdoctoral Researcher · Bradke Lab"
institution: "German Center for Neurodegenerative Diseases (DZNE)"
email: tien-chen.lin@dzne.de
photo: tienchen-lin.jpg  # place your photo in images/

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: "https://scholar.google.com/citations?user=xARPM5QAAAAJ"
  github: "https://github.com/darkbreaker0"
  researchgate: "https://www.researchgate.net/profile/Tien-Chen-Lin"
  orcid: "https://orcid.org/0000-0002-6852-2900"
  twitter: ""
  linkedin: "https://www.linkedin.com/in/tien-chen-lin/"
  cv: "papers/Tien-Chen-Lin-CV.pdf"  # e.g., "papers/cv.pdf" — leave blank to hide the CV icon

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#6a49c4"        # links/buttons in light mode (WCAG AA on parchment: 5.8:1)
accent_color_dark: "#a78bfa"   # links/buttons in dark mode (bright violet, readable on dark)
dark_mode: true              # show dark mode toggle in navbar
description: "Tien-Chen Lin — cytoskeletal neurobiology and the mechanobiology of brain development. Postdoctoral researcher (DZNE, Bradke Lab) developing an independent research program on how the cytoskeleton shapes the nervous system."
baseurl: ""
url: "https://darkbreaker0.github.io"

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: research
  - name: publications
  - name: code
    label: "Code"
  - name: cv
    label: "CV"
  - name: futurelab
    label: "Future Lab"
  - name: contact

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Lin
  first_name: [Tien-Chen, Tien-chen, T.-C., T.-c.]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - tools
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
